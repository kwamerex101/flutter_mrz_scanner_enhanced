group 'io.github.olexale.flutter_mrz_scanner'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.25'
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 35
    namespace "io.github.olexale.flutter_mrz_scanner"
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25'
    // 4.8.0 adds 16 KB page size support required for Android 15 / Google Play compliance.
    // Published via JitPack as the cz.adaptech coordinates were not updated on Maven Central.
    implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android:4.8.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'io.fotoapparat:fotoapparat:2.7.0'
    implementation 'androidx.annotation:annotation-jvm:1.9.1'
    // ML Kit on-device text recognition (Latin model, bundled). Used by the
    // static MRZScanner.scanImage path. The live camera path keeps Tesseract.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Host-side unit tests for pure logic (PreprocessingFailureLatch). No
    // Android framework or device needed — runs under `./gradlew test`.
    testImplementation 'junit:junit:4.13.2'
}
